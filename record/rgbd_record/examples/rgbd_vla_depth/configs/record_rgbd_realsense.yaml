# Ready-to-run all-RealSense RGB-D rig:
#   front: D435 / D435i (mid-range stereo depth, 848x480@30 depth sweet spot)
#   wrist: D405 (near-range depth, ~7cm-50cm, ideal for grasping close-ups)
# Depth for intelrealsense always shares width/height/fps with the color stream.
# Both depth streams are stored as lossless uint16 PNG under depth_sidecar/.
# Find serials with: lerobot-find-cameras realsense
robot:
  type: so100_follower
  id: so100_rgbd_follower
  port: /dev/ttyACM0
  use_degrees: true
  cameras:
    front:
      type: intelrealsense
      serial_number_or_name: "REPLACE_WITH_D435_SERIAL"
      fps: 30
      width: 848
      height: 480
      use_depth: true
    wrist:
      type: intelrealsense
      serial_number_or_name: "REPLACE_WITH_D405_SERIAL"
      fps: 30
      width: 640
      height: 480
      use_depth: true
teleop:
  type: so100_leader
  id: so100_leader
  port: /dev/ttyACM1
dataset:
  repo_id: YOUR_HF_USERNAME/so100_rgbd_realsense_dataset
  fps: 30
  single_task: Place the object precisely using the front depth camera.
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 30
  video: true
  push_to_hub: false
  streaming_encoding: false
display_data: true
display_port: 9876
