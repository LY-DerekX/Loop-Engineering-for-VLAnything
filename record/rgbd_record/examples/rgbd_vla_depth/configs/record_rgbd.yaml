robot:
  type: so100_follower
  id: so100_rgbd_follower
  port: /dev/ttyACM0
  use_degrees: true
  # ------------------------------------------------------------------
  # Camera switching
  #
  # Each entry under `cameras` picks a backend through `type`:
  #   orbbec          Orbbec Femto Bolt RGB-D (pyorbbecsdk, extra: [orbbec])
  #   intelrealsense  Intel RealSense D405 / D435 / D435i RGB-D
  #                   (pyrealsense2, extra: [intelrealsense])
  #   opencv          any plain UVC RGB webcam
  #
  # Keep exactly ONE active block per camera name and leave the other
  # variants commented out. Find serial numbers with:
  #   lerobot-find-cameras orbbec
  #   lerobot-find-cameras realsense
  #
  # Depth notes:
  #   - orbbec: depth stream has its own depth_width/depth_height/depth_fps;
  #     align_depth_to_color=true reports depth in RGB pixel coordinates.
  #   - intelrealsense: depth always uses the same width/height/fps as the
  #     color stream; no separate depth resolution fields exist.
  #   - any camera with use_depth=true produces an `<name>_depth` stream that
  #     is stored as lossless uint16 PNG under depth_sidecar/.
  # ------------------------------------------------------------------
  cameras:
    # --- front: Orbbec Femto Bolt (active) ---
    front:
      type: orbbec
      serial_number_or_name: "REPLACE_WITH_FEMTO_BOLT_SERIAL"
      fps: 30
      width: 1280
      height: 720
      use_depth: true
      depth_fps: 30
      depth_width: 640
      depth_height: 576
      align_depth_to_color: true

    # --- front: Intel RealSense D435 / D435i (alternative) ---
    # 848x480@30 is the D435 depth sweet spot; 640x480 and 1280x720@30 also work.
    # front:
    #   type: intelrealsense
    #   serial_number_or_name: "REPLACE_WITH_D435_SERIAL"
    #   fps: 30
    #   width: 848
    #   height: 480
    #   use_depth: true

    # --- wrist: plain RGB webcam (active) ---
    wrist:
      type: opencv
      index_or_path: /dev/video0
      fps: 30
      width: 640
      height: 480

    # --- wrist: Intel RealSense D405 (alternative, near-range RGB-D 7cm-50cm) ---
    # wrist:
    #   type: intelrealsense
    #   serial_number_or_name: "REPLACE_WITH_D405_SERIAL"
    #   fps: 30
    #   width: 640
    #   height: 480
    #   use_depth: true
teleop:
  type: so100_leader
  id: so100_leader
  port: /dev/ttyACM1
dataset:
  repo_id: YOUR_HF_USERNAME/so100_rgbd_dataset
  fps: 30
  single_task: Place the object precisely using the front depth camera.
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 30
  video: true
  push_to_hub: false
  streaming_encoding: false
display_data: true
display_port: 9876
